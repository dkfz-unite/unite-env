services:
  identity.unite.net:
    image: ghcr.io/dkfz-unite/unite-identity:latest
    pull_policy: always
    container_name: unite.identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      UNITE_INSTANCE_HOST: ${UNITE_INSTANCE_HOST}
      UNITE_INSTANCE_PUBLIC: ${UNITE_INSTANCE_PUBLIC}
      UNITE_RETENTION_PERIOD: ${UNITE_RETENTION_PERIOD}
      UNITE_RESET_TTL: ${UNITE_RESET_TTL:-30}
      UNITE_SMTP_HOST: ""
      UNITE_SMTP_PORT: 587
      UNITE_SMTP_SSL_ENABLE: "true"
      UNITE_SMTP_AUTH_METHOD: "login"
      UNITE_SMTP_NTLM_DOMAIN: ""
      UNITE_SMTP_FROM: ""
      UNITE_SMTP_USER: ""
      UNITE_SMTP_PASSWORD: ""
      UNITE_SQL_HOST: ${UNITE_PGSQL_HOST}
      UNITE_SQL_PORT: ${UNITE_PGSQL_PORT}
      UNITE_SQL_USER: ${UNITE_PGSQL_USER}
      UNITE_SQL_PASSWORD: ${UNITE_PGSQL_PASSWORD}
      UNITE_MONGO_HOST: ${UNITE_MONGO_HOST}
      UNITE_MONGO_PORT: ${UNITE_MONGO_PORT}
      UNITE_MONGO_USER: ${UNITE_MONGO_USER}
      UNITE_MONGO_PASSWORD: ${UNITE_MONGO_PASSWORD}
      UNITE_API_KEY: ${UNITE_API_KEY}
      UNITE_ADMIN_USER: ${UNITE_ADMIN_USER}
      UNITE_ADMIN_PASSWORD: ${UNITE_ADMIN_PASSWORD}
      UNITE_DEFAULT_LABEL: "UNITE"
      UNITE_DEFAULT_PRIORITY: 1
    ports: 
      - 127.0.0.1:5000:80

networks: 
  default:
    name: unite
    external: true
