services:
  migrations.identity.unite.net:
    image: ghcr.io/dkfz-unite/unite-identity-data-migrations:latest
    pull_policy: always
    container_name: unite.identity.migrations
    environment:
      UNITE_SQL_HOST: ${UNITE_PGSQL_HOST}
      UNITE_SQL_PORT: ${UNITE_PGSQL_PORT}
      UNITE_SQL_USER: ${UNITE_PGSQL_USER}
      UNITE_SQL_PASSWORD: ${UNITE_PGSQL_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Release

networks: 
  default:
    name: unite
    external: true
