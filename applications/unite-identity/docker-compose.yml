services:
  identity.unite.net:
    image: ghcr.io/dkfz-unite/unite-identity:latest
    pull_policy: always
    container_name: unite.identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      UNITE_INSTANCE_HOST: ${UNITE_INSTANCE_HOST}
      UNITE_INSTANCE_PUBLIC: ${UNITE_INSTANCE_PUBLIC}
      UNITE_RETENTION_PERIOD: ${UNITE_RETENTION_PERIOD}
      UNITE_SMTP_HOST: ${SMTP_HOST}
      UNITE_SMTP_PORT: ${SMTP_PORT}
      UNITE_SMTP_TLS_STARTTLS: ${SMTP_TLS_STARTTLS}
      UNITE_SMTP_TLS_CERTCHECK: ${SMTP_TLS_CERTCHECK}
      UNITE_SMTP_AUTH: ${SMTP_AUTH}
      UNITE_SMTP_NTLM_DOMAIN: ${SMTP_NTLM_DOMAIN}
      UNITE_SMTP_FROM: ${SMTP_FROM}
      UNITE_SMTP_USER: ${SMTP_USER}
      UNITE_SMTP_PASSWORD: ${SMTP_PASSWORD}
      UNITE_MONGO_HOST: mongo.unite.net
      UNITE_MONGO_PORT: 27017
      UNITE_MONGO_USER: ${MONGO_USER}
      UNITE_MONGO_PASSWORD: ${MONGO_PASSWORD}
      UNITE_SQL_HOST: pgsql.unite.net
      UNITE_SQL_PORT: 5432
      UNITE_SQL_USER: ${SQL_USER}
      UNITE_SQL_PASSWORD: ${SQL_PASSWORD}
      UNITE_API_KEY: ${API_KEY}
      UNITE_ADMIN_USER: ${ADMIN_USER}
      UNITE_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UNITE_DEFAULT_LABEL: "UNITE"
      UNITE_DEFAULT_PRIORITY: 1
    ports: 
      - 127.0.0.1:5000:80

networks: 
  default:
    name: unite
    external: true
