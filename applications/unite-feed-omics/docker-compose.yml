services:
  omics.feed.unite.net:
    image: ghcr.io/dkfz-unite/unite-feed-omics:latest
    pull_policy: always
    container_name: unite.feed.omics
    restart: unless-stopped
    environment:
      UNITE_API_KEY: ${UNITE_API_KEY}
      UNITE_ELASTIC_HOST: ${UNITE_ELASTIC_HOST}
      UNITE_ELASTIC_USER: ${UNITE_ELASTIC_USER}
      UNITE_ELASTIC_PASSWORD: ${UNITE_ELASTIC_PASSWORD}
      UNITE_SQL_HOST: ${UNITE_PGSQL_HOST}
      UNITE_SQL_PORT: ${UNITE_PGSQL_PORT}
      UNITE_SQL_USER: ${UNITE_PGSQL_USER}
      UNITE_SQL_PASSWORD: ${UNITE_PGSQL_PASSWORD}
      UNITE_MONGO_HOST: ${UNITE_MONGO_HOST}
      UNITE_MONGO_PORT: ${UNITE_MONGO_PORT}
      UNITE_MONGO_USER: ${UNITE_MONGO_USER}
      UNITE_MONGO_PASSWORD: ${UNITE_MONGO_PASSWORD}
      UNITE_ENSEMBL_DATA_HOST: http://data.ensembl.unite.net
      UNITE_ENSEMBL_VEP_HOST: http://vep.ensembl.unite.net
      UNITE_GENES_INDEXING_BUCKET_SIZE: 100
      UNITE_PROTEINS_INDEXING_BUCKET_SIZE: 100
      UNITE_SM_ANNOTATION_BUCKET_SIZE: 100
      UNITE_SM_INDEXING_BUCKET_SIZE: 300
      UNITE_CNV_ANNOTATION_BUCKET_SIZE: 10
      UNITE_CNV_INDEXING_BUCKET_SIZE: 100
      UNITE_SV_ANNOTATION_BUCKET_SIZE: 10
      UNITE_SV_INDEXING_BUCKET_SIZE: 100
      UNITE_GENOME_BUILD: GRCh37
      ASPNETCORE_ENVIRONMENT: Release
    ports: 
      - 127.0.0.1:5106:80

networks: 
  default:
    name: unite
    external: true
