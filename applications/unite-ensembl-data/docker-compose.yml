services:
  data.ensembl.unite.net:
    image: ghcr.io/dkfz-unite/unite-ensembl-data:latest
    pull_policy: always
    container_name: unite.ensembl.data
    restart: unless-stopped
    environment: 
      ENSEMBL_SQL_HOST: ${UNITE_MYSQL_HOST}
      ENSEMBL_SQL_PORT: ${UNITE_MYSQL_PORT}
      ENSEMBL_SQL_USER: ${UNITE_MYSQL_USER}
      ENSEMBL_SQL_PASSWORD: ${UNITE_MYSQL_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Release
    ports: 
      - 127.0.0.1:5200:80

networks: 
  default:
    name: unite
    external: true
